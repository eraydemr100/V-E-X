<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asistan - Karizmatik Yapay Zeka</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0f19;
            --chat-bg: #111827;
            --panel-bg: #1f2937;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --neon-glow-blue: rgba(59, 130, 246, 0.5);
            --neon-glow-purple: rgba(139, 92, 246, 0.5);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: #374151;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 15px var(--neon-glow-blue);
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text span {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            margin-left: auto;
            flex-direction: row-reverse;
        }

        .message.ai {
            margin-right: auto;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin: 0 10px;
        }

        .user .avatar {
            background-color: var(--accent-blue);
            color: white;
            box-shadow: 0 0 10px var(--neon-glow-blue);
        }

        .ai .avatar {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            box-shadow: 0 0 12px var(--neon-glow-purple);
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
        }

        .user .bubble {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .ai .bubble {
            background-color: var(--chat-bg);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        /* Typing Indicator Animation */
        .typing-indicator span {
            height: 8px;
            width: 8px;
            float: left;
            margin: 0 2px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            display: inline-block;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: -1.1s; }
        .typing-indicator span:nth-child(3) { animation-delay: -0.9s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }

        /* Input Area */
        .input-container {
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .input-wrapper {
            flex: 1;
            position: relative;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 15px var(--neon-glow-blue);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 14px;
            padding: 12px 0;
            resize: none;
            max-height: 120px;
            outline: none;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--neon-glow-blue);
            flex-shrink: 0;
        }

        .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px var(--neon-glow-purple);
        }

        .send-btn:active {
            transform: scale(0.95);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fa-solid fa-brain"></i>
            </div>
            <div class="logo-text">
                <h1>AI Asistan</h1>
                <span>Karizmatik & Hızlı Yapay Zeka</span>
            </div>
        </div>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>Aktif & Hazır</span>
        </div>
    </header>

    <!-- Chat Messages -->
    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            <div class="avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="bubble">Selam! Ben senin karizmatik yapay zeka asistanınım. Tarih, bilimsel gerçekler, genel kültür ya da herhangi bir konuda bana soru sorabilirsin. Sana nasıl yardımcı olabilirim?</div>
        </div>
    </div>

    <!-- Input Form -->
    <div class="input-container">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="Bir şeyler yazın..." rows="1" autofocus></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Otomatik yükseklik ayarı (textarea)
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Enter ile gönderme (Shift+Enter alt satıra geçer)
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);

            const avatarDiv = document.createElement('div');
            avatarDiv.classList.add('avatar');
            avatarDiv.innerHTML = sender === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('bubble');
            bubbleDiv.innerText = text;

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const indicatorDiv = document.createElement('div');
            indicatorDiv.classList.add('message', 'ai');
            indicatorDiv.id = 'typingIndicator';

            const avatarDiv = document.createElement('div');
            avatarDiv.classList.add('avatar');
            avatarDiv.innerHTML = '<i class="fa-solid fa-robot"></i>';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('bubble');
            bubbleDiv.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            indicatorDiv.appendChild(avatarDiv);
            indicatorDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(indicatorDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        // Akıllı Bilgi Motoru (Tarih, Bilim ve Doğru Cevaplar)
        function getSmartAIResponse(query) {
            const q = query.toLowerCase().trim();

            // Tarih ve Olaylar
            if (q.includes('istanbul\'un fethi') || q.includes('istanbul ne zaman fethedildi')) {
                return 'İstanbul, Osmanlı Padişahı II. Mehmed (Fatih Sultan Mehmet) komutasında 29 Mayıs 1453 tarihinde fethedilmiştir. Bu olay Orta Çağ\'ın kapanıp Yeni Çağ\'ın başlamasında dönüm noktası olmuştur.';
            }
            if (q.includes('türkiye cumhuriyeti ne zaman kuruldu') || q.includes('cumhuriyet ne zaman')) {
                return 'Türkiye Cumhuriyeti, 29 Ekim 1923 tarihinde Türkiye Büyük Millet Meclisi tarafından ilan edilmiştir.';
            }
            if (q.includes('atatürk kimdir') || q.includes('mustafa kemal')) {
                return 'Mustafa Kemal Atatürk, Türkiye Cumhuriyeti\'nin kurucusu, ilk cumhurbaşkanı ve Türk askeri ve devlet adamıdır. Birinci Dünya Savaşı sonrasında Türk Kurtuluş Savaşı\'na liderlik etmiş, modern Türkiye\'yi inşa eden inkılapları gerçekleştirmiştir.';
            }

            // Bilimsel Gerçekler ve Fizik
            if (q.includes('izafiyet') || q.includes('görelilik') || q.includes('einstein')) {
                return 'Albert Einstein\'ın Görelilik Teorisi (İzafiyet), uzay ve zamanın mutlak olmadığını, gözlemcinin hareketine göre değiştiğini savunur. Özel Görelilik (1905) ışık hızının sabitliğine dayanırken, Genel Görelilik (1915) kütle çekiminin uzay-zaman dokusunun bükülmesiyle oluştuğunu açıklar.';
            }
            if (q.includes('fotosentez')) {
                return 'Fotosentez, bitkilerin, alglerin ve bazı bakterilerin güneş ışığını kullanarak karbondioksit ve suyu glikoza (şeker) dönüştürmesi ve yan ürün olarak oksijen üretmesi sürecidir. Kimyasal formülü genel hatlarıyla: 6CO₂ + 6H₂O + Işık Enerjisi → C₆H₁₂O₆ + 6O₂ şeklindedir.';
            }
            if (q.includes('su neden') || q.includes('h2o')) {
                return 'Su (H₂O), iki hidrojen ve bir oksijen atomunun kovalent bağlarla birleşmesiyle oluşan kimyasal bir bileşiktir. Dünya yüzeyinin yaklaşık %71\'ini kaplar ve tüm bilinen yaşam biçimleri için hayati önem taşır.';
            }
            if (q.includes('ışık hızı') || q.includes('hızı kaç')) {
                return 'Işığın boşluktaki hızı saniyede yaklaşık 299.792.458 metredir (saniyede yaklaşık 300.000 kilometre). Einstein\'ın teorilerine göre evrendeki hiçbir kütleli nesne bu hızı aşamaz.';
            }

            // Programlama & Kodlama
            if (q.includes('javascript') || q.includes('js nedir')) {
                return 'JavaScript, web sayfalarına dinamik ve interaktif özellikler kazandıran yüksek seviyeli, yorumlanan bir programlama dilidir. HTML ve CSS ile birlikte modern web geliştirmenin üç temel taşından biridir.';
            }
            if (q.includes('python')) {
                return 'Python, okunabilirliği yüksek, sade sözdizimine sahip, yapay zeka, veri analizi, web geliştirme ve otomasyon alanlarında yaygın olarak kullanılan güçlü bir programlama dilidir.';
            }

            // Selamlama ve Genel
            if (q.includes('merhaba') || q.includes('selam') || q.includes('hey')) {
                return 'Selam! Sana nasıl yardımcı olabilirim? Bilim, tarih, teknoloji veya aklına takılan herhangi bir konuyu konuşabiliriz.';
            }
            if (q.includes('nasılsın') || q.includes('nasıl gitmektedir')) {
                return 'Sistemler tamamen aktif ve kusursuz çalışıyor! Sen nasılsın, bugün hangi konuyu derinlemesine inceleyelim?';
            }
            if (q.includes('adın ne') || q.includes('kimsin')) {
                return 'Ben senin özel olarak tasarladığın, koyu tema ve neon estetiğiyle güçlendirilmiş yapay zeka asistanınım.';
            }

            // Varsayılan Akıllı Yanıt
            return `"${query}" konusunu analiz ettim. Bu konuda bilinen en güncel bilimsel ve tarihsel veriler doğrultusunda; belirttiğin talepler doğrultusunda sistem optimize edilmiştir. Daha detaylı veya spesifik bir soru sormak ister misin?`;
        }

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Kullanıcı mesajını ekle
            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            // Yazıyor animasyonu göster
            showTypingIndicator();

            // Doğal ve hızlı yanıt simülasyonu (300-600ms arası)
            const responseDelay = Math.random() * 300 + 300;

            setTimeout(() => {
                removeTypingIndicator();
                const aiReply = getSmartAIResponse(text);
                appendMessage('ai', aiReply);
            }, responseDelay);
        }
    </script>
</body>
</html>
