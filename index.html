<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VEXcode AI | Bilimsel Yapay Zeka Asistanı</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: #131b2e;
      --accent-blue: #4f46e5;
      --accent-hover: #4338ca;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #1f293d;
      --user-msg-bg: #3730a3;
      --bot-msg-bg: #1e293b;
      --error-bg: #7f1d1d;
      --error-text: #fecaca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100%;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      color: white;
    }

    .title-group h1 {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .version-tag {
      font-size: 10px;
      background-color: var(--border-color);
      padding: 2px 5px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .team-info {
      font-size: 10px;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .btn {
      background-color: var(--border-color);
      color: var(--text-main);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-primary {
      background-color: var(--accent-blue);
      color: white;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .user-msg {
      align-self: flex-end;
      background-color: var(--user-msg-bg);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .bot-msg {
      align-self: flex-start;
      background-color: var(--bot-msg-bg);
      color: var(--text-main);
      border-bottom-left-radius: 2px;
      border: 1px solid var(--border-color);
    }

    .error-msg {
      align-self: center;
      background-color: var(--error-bg);
      color: var(--error-text);
      border: 1px solid #991b1b;
      font-size: 12px;
    }

    footer {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 10px 12px;
      flex-shrink: 0;
    }

    .input-container {
      display: flex;
      gap: 8px;
      align-items: center;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 6px 10px;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14px;
      resize: none;
      max-height: 100px;
      height: 24px;
      line-height: 24px;
    }

    .send-btn {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
    }

    .modal h2 { margin-bottom: 8px; font-size: 16px; }
    .modal p { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
    .modal input {
      width: 100%;
      padding: 10px;
      background-color: var(--bg-dark);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand">
        <div class="logo">V</div>
        <div class="title-group">
          <h1>VEXcode AI <span class="version-tag">v2.7</span></h1>
          <div class="team-info">Ekip: Veyra | Lyra | Veylox | Aria</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn" id="apiKeyBtn">🔑 API</button>
        <button class="btn" id="clearBtn">🗑️</button>
      </div>
    </header>

    <main id="chatWindow">
      <div class="chat-bubble bot-msg">Merhaba! Ben VEXcode AI. Bilimsel ve teknik sorularınızı yanıtlamaya hazırım. Alt kısımdan yazmaya başlayabilirsiniz!</div>
    </main>

    <footer>
      <div class="input-container">
        <textarea id="userInput" placeholder="Mesajınızı yazın..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn">➔</button>
      </div>
    </footer>
  </div>

  <div class="modal-overlay hidden" id="apiModal">
    <div class="modal">
      <h2>Google Gemini API Anahtarı</h2>
      <p>Yapay zekanın cevap verebilmesi için bir API anahtarı ekleyin. Yalnızca tarayıcınızda saklanır.</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy..." />
      <div class="modal-actions">
        <button class="btn" id="closeModalBtn">Kapat</button>
        <button class="btn btn-primary" id="saveKeyBtn">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    const chatWindow = document.getElementById('chatWindow');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const apiModal = document.getElementById('apiModal');
    const apiKeyBtn = document.getElementById('apiKeyBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveKeyBtn = document.getElementById('saveKeyBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const clearBtn = document.getElementById('clearBtn');

    let apiKey = localStorage.getItem('vex_gemini_api_key') || '';

    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    apiKeyBtn.addEventListener('click', () => {
      apiKeyInput.value = apiKey;
      apiModal.classList.remove('hidden');
    });

    closeModalBtn.addEventListener('click', () => apiModal.classList.add('hidden'));

    saveKeyBtn.addEventListener('click', () => {
      const val = apiKeyInput.value.trim();
      if (val) {
        apiKey = val;
        localStorage.setItem('vex_gemini_api_key', val);
        alert('API Anahtarı başarıyla kaydedildi!');
        apiModal.classList.add('hidden');
      }
    });

    clearBtn.addEventListener('click', () => {
      chatWindow.innerHTML = '<div class="chat-bubble bot-msg">Sohbet temizlendi. Bir soru sorun!</div>';
    });

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (!apiKey) {
        alert('Lütfen sağ üstteki "🔑 API" butonuna basarak Gemini API anahtarınızı girin.');
        apiModal.classList.remove('hidden');
        return;
      }

      appendBubble(text, 'user-msg');
      userInput.value = '';
      userInput.style.height = '24px';

      const botBubble = appendBubble('Yanıt hazırlanıyor...', 'bot-msg');
      sendBtn.disabled = true;

      try {
        // En kararlı ve en geniş çaplı desteklenen gemini-1.5-flash modeli
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
        
        // İstek takılırsa 15 saniyede zaman aşımına uğratacak yapı
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: "Sen VEXcode AI bilimsel asistanısın. Doğrulanmış bilimsel gerçeklere dayanarak Türkçe cevap ver:\n\nSoru: " + text }]
            }]
          }),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        const data = await response.json();

        if (!response.ok) {
          const errDetail = data.error ? data.error.message : 'API Hatası';
          botBubble.className = 'chat-bubble error-msg';
          botBubble.innerText = `Hata: ${errDetail}`;
        } else if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
          botBubble.innerText = data.candidates[0].content.parts[0].text;
        } else {
          botBubble.className = 'chat-bubble error-msg';
          botBubble.innerText = 'Yapay zekadan boş yanıt döndü.';
        }
      } catch (err) {
        botBubble.className = 'chat-bubble error-msg';
        if (err.name === 'AbortError') {
          botBubble.innerText = 'Bağlantı Zaman Aşımı: Sunucu çok geç yanıt verdi.';
        } else {
          botBubble.innerText = 'Bağlantı Hatası: ' + err.message;
        }
      } finally {
        sendBtn.disabled = false;
        scrollToBottom();
      }
    }

    function appendBubble(text, className) {
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${className}`;
      bubble.innerText = text;
      chatWindow.appendChild(bubble);
      scrollToBottom();
      return bubble;
    }

    function scrollToBottom() {
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }
  </script>
</body>
</html>
