
<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080812"><title>VEX AI</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#211442,#080812 55%);color:#f5f3ff;font:16px/1.6 system-ui,sans-serif;height:100dvh}.app{max-width:900px;height:100%;margin:auto;display:flex;flex-direction:column;padding:18px}header{display:flex;align-items:center;gap:13px;padding:8px 0 18px;border-bottom:1px solid #302647}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#36a4ff,#a34bff);font-size:25px;font-weight:900;box-shadow:0 0 25px #824cff55}h1{font-size:21px;margin:0;letter-spacing:2px}.status{color:#8ee9b4;font-size:12px}#chat{flex:1;overflow-y:auto;padding:24px 2px;display:flex;flex-direction:column;gap:18px}.welcome{text-align:center;margin:auto 0}.welcome h2{font-size:clamp(30px,7vw,46px);line-height:1.2;background:linear-gradient(90deg,#42baff,#b16aff);background-clip:text;-webkit-background-clip:text;color:transparent}.welcome p,.hint{color:#9696b4}.message{max-width:85%;padding:13px 16px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:linear-gradient(135deg,#254d85,#503080);border:1px solid #6d83ff55;border-bottom-right-radius:5px}.assistant{align-self:flex-start;background:#111020;border:1px solid #353050;border-bottom-left-radius:5px}.composer{padding:12px;border:1px solid #393052;background:#10101ded;border-radius:20px;box-shadow:0 0 28px #6536ff12}form{display:flex;align-items:flex-end;gap:10px}textarea{flex:1;resize:none;max-height:150px;min-height:46px;border:0;outline:0;background:transparent;color:#fff;font:inherit;padding:10px 6px}textarea::placeholder{color:#8585a3}button{border:0;cursor:pointer;border-radius:13px;font:inherit}#send{width:46px;height:46px;color:white;font-size:21px;background:linear-gradient(135deg,#328fff,#984bff)}button:disabled{opacity:.5;cursor:wait}.hint{font-size:11px;margin:8px 4px 0}.error{color:#ffaaaa}@media(max-width:520px){.app{padding:12px}.message{max-width:94%}}
</style></head><body><main class="app"><header><div class="logo">V</div><div><h1>VEX AI</h1><div class="status">● Yapay zekâ asistanı</div></div></header><section id="chat" aria-live="polite"><div class="welcome" id="welcome"><h2>Think Beyond.</h2><p>Merhaba! Ben VEX AI. Bugün ne öğrenmek istersin?</p></div></section><section class="composer"><form id="form"><textarea id="prompt" rows="1" placeholder="VEX AI'ye bir şey sor..." aria-label="Mesajın" required></textarea><button id="send" type="submit" aria-label="Gönder">➤</button></form><div class="hint">VEX AI hata yapabilir. Önemli bilgileri doğrula.</div></section></main><script>
const API_URL="/api/chat";const form=document.querySelector("#form"),input=document.querySelector("#prompt"),chat=document.querySelector("#chat"),send=document.querySelector("#send");const history=[];
function addMessage(text,role){document.querySelector("#welcome")?.remove();const el=document.createElement("div");el.className="message "+role;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el}
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,150)+"px"});input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
form.addEventListener("submit",async e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;addMessage(text,"user");history.push({role:"user",content:text});input.value="";input.style.height="auto";send.disabled=true;const answer=addMessage("VEX AI düşünüyor...","assistant");try{const response=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Yanıt alınamadı.");if(typeof data.reply!=="string")throw new Error("Sunucu geçersiz cevap verdi.");answer.textContent=data.reply;history.push({role:"assistant",content:data.reply})}catch(err){answer.textContent="VEX AI sunucusuna bağlanılamadı.\n"+err.message+"\nAPI_URL adresini ve sunucunu kontrol et.";answer.classList.add("error");history.pop()}finally{send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight}});
</script></body></html>
